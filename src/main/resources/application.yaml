spring:
  application:
    name: sboot-lume-monolith-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lume_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 5000
  flyway:
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  modulith:
    events:
      completion-mode: delete
      jpa:
        schema-initialization:
          enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS}
  issuer: ${JWT_ISSUER:lume}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

lume:
  zona-negocio: America/Sao_Paulo
  security:
    crypto:
      cpf-hmac-key: ${CPF_HMAC_KEY}
      cpf-aes-key: ${CPF_AES_KEY}
  auth:
    lockout:
      max-tentativas: 5
      minutos-bloqueio: 15
      tentativas-apos-desbloqueio: 3
  geo:
    diagnostico:
      raio-minimo-metros: 300
      raio-padrao-metros: 500
      raio-maximo-metros: 500
    mapa:
      raio-minimo-metros: 100
      raio-padrao-metros: 500
      raio-maximo-metros: 1000
      limite-maximo-pontos: 500
      dias-maximo: 365
    estabelecimento:
      raio-minimo-metros: 100
      raio-padrao-metros: 1000
      raio-maximo-metros: 5000
  reputacao:
    fator-dias-30: 1.0
    fator-dias-90: 0.6
    fator-dias-365: 0.2
    fator-residual: 0.05
    multiplicador-validacao: 0.2

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId}] %-40.40logger{39} : %m%n"
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs