spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lume_db
    username: postgres
    password: postgres

jwt:
  secret: chave-secreta-desenvolvimento-lume-api-minimo-256-bits-segura
  expiration: 900000
  refresh-expiration: 604800000
  issuer: lume

cors:
  allowed-origins: "http://localhost:3000,http://localhost:8080"

lume:
  security:
    crypto:
      cpf-hmac-key: chave-secreta-hmac-cpf-lume-api-minimo-256-bits
      cpf-aes-key: chave-secreta-aes-cpf-lume-32byt